<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cảm Ơn Bạn!</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .thank-you-box {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
    }
    h1 {
      color: #28a745;
      font-size: 2rem;
    }
    p {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #555;
    }
    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.2rem;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    a:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <h1>🎉 Cảm ơn bạn!</h1>
    <p>Đơn thanh toán của bạn đã được gửi thành công.<br>
    Chúng tôi sẽ xử lý trong thời gian sớm nhất.</p>
    <a href="index.html">← Quay lại Trang chủ</a>
  </div>
</body>
</html>
