<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt hàng thành công!</title>
  <style>
    body {
      background-color: #f7f9fc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px;
    }

    .box {
      background: #fff;
      max-width: 500px;
      margin: 0 auto;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    h1 {
      color: #198754;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #0d6efd;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ Đặt hàng thành công!</h1>
    <p>Chúng tôi đã nhận được đơn hàng của bạn.<br>Vui lòng chuyển khoản đúng thông tin để xử lý.</p>
    <a href="index.html">← Quay lại trang chủ</a>
  </div>
</body>
</html>
