<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Phần head giữ nguyên như trước -->
    <!-- ... -->
</head>
<body>
    <!-- Phần header và các phần khác giữ nguyên -->
    <!-- ... -->

    <!-- Order Summary -->
    <div class="order-summary">
        <h2>Thông Tin Đơn Hàng</h2>
        <div class="order-id">Mã đơn hàng: <span id="order-id">VPS-${generateOrderId()}</span></div>
        <div class="summary-item">
            <span>Gói VPS:</span>
            <span id="plan-name">VPS 1 - 1 Core / 1GB RAM / 20GB SSD</span>
        </div>
        <div class="summary-item">
            <span>Giá gốc:</span>
            <span id="base-price">55.000đ/tháng</span>
        </div>
        <div class="summary-item">
            <span>Thời gian thuê:</span>
            <span id="duration">1 tháng</span>
        </div>
        <div class="summary-item">
            <span>Khuyến mãi:</span>
            <span id="discount">0đ</span>
        </div>
        <div class="summary-item">
            <span>Tổng cộng:</span>
            <span id="total-price">55.000đ</span>
        </div>
    </div>

    <!-- Payment Form -->
    <div class="payment-form">
        <!-- Các phần khác giữ nguyên -->
        <!-- ... -->

        <div class="form-group">
            <label for="duration-select">Thời gian thuê</label>
            <select id="duration-select" name="duration" required>
                <option value="1" data-months="1" data-price="55000">1 tháng - 55.000đ</option>
                <option value="3" data-months="3" data-price="156750" data-discount="5%">3 tháng - 156.750đ (5% off)</option>
                <option value="6" data-months="6" data-price="297000" data-discount="10%">6 tháng - 297.000đ (10% off)</option>
                <option value="12" data-months="12" data-price="561000" data-discount="15%">12 tháng - 561.000đ (15% off)</option>
            </select>
        </div>

        <!-- Các phần khác giữ nguyên -->
        <!-- ... -->
    </div>

    <!-- Phần footer giữ nguyên -->
    <!-- ... -->

    <script>
        // Tạo mã đơn hàng ngẫu nhiên
        function generateOrderId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }
        
        // Khởi tạo đơn hàng
        const orderId = 'VPS-' + generateOrderId();
        document.getElementById('order-id').textContent = orderId;
        document.getElementById('form-order-id-input').value = orderId;
        document.getElementById('form-order-id').textContent = orderId;
        document.querySelector('input[name="_next"]').value += orderId;
        
        // Giá gốc của gói VPS
        const basePricePerMonth = 55000;
        
        // Hiển thị thông tin đơn hàng ban đầu
        document.getElementById('plan-name').textContent = 'VPS 1 - 1 Core / 1GB RAM / 20GB SSD';
        document.getElementById('base-price').textContent = formatPrice(basePricePerMonth) + '/tháng';
        updateOrderSummary(1, basePricePerMonth, 0);
        
        // Xử lý chọn thời gian thuê
        document.getElementById('duration-select').addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const months = parseInt(selectedOption.getAttribute('data-months'));
            const totalPrice = parseInt(selectedOption.getAttribute('data-price'));
            const discount = selectedOption.getAttribute('data-discount') || '0%';
            
            updateOrderSummary(months, totalPrice, discount);
        });

        // Cập nhật thông tin đơn hàng
        function updateOrderSummary(months, totalPrice, discount) {
            document.getElementById('duration').textContent = months + ' tháng';
            document.getElementById('discount').textContent = discount !== '0%' ? discount : '0đ';
            document.getElementById('total-price').textContent = formatPrice(totalPrice);
            
            // Cập nhật các trường ẩn trong form
            document.getElementById('form-duration').value = months + ' tháng';
            document.getElementById('form-total').value = totalPrice;
            
            updatePaymentContents();
        }
        
        // Các hàm phụ trợ khác giữ nguyên
        function updatePaymentContents() {
            const phone = document.getElementById('phone').value || '[Số điện thoại]';
            const orderId = document.getElementById('order-id').textContent;
            
            document.getElementById('payment-content').textContent = `[Mã đơn: ${orderId}] - ${phone}`;
            document.getElementById('order-id-content').textContent = orderId;
            document.getElementById('momo-content').textContent = `[Mã đơn: ${orderId}] - ${phone}`;
            document.getElementById('momo-order-id').textContent = orderId;
            document.getElementById('zalopay-content').textContent = `[Mã đơn: ${orderId}] - ${phone}`;
            document.getElementById('zalopay-order-id').textContent = orderId;
        }
        
        function formatPrice(amount) {
            return parseInt(amount).toLocaleString('vi-VN') + 'đ';
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Đã sao chép: ' + text);
            }).catch(err => {
                console.error('Lỗi khi sao chép: ', err);
            });
        }
        
        // Khởi tạo nội dung thanh toán
        updatePaymentContents();
    </script>
</body>
</html>
