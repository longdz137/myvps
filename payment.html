<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanh Toán Dịch Vụ VPS - Công Ty ABC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background-color: #f7f9fc;
      color: #333;
    }

    header {
      background-color: #0d6efd;
      color: #fff;
      padding: 20px 40px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0d6efd;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      background-color: #198754;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #157347;
    }

    .bank-info {
      background: #e9f5ff;
      padding: 15px;
      margin-top: 15px;
      border-left: 4px solid #0d6efd;
      display: none;
      border-radius: 6px;
      font-size: 14px;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>CÔNG TY ABC - ĐẶT MUA VPS</h1>
</header>

<div class="container">
  <h2>Thông Tin Đặt Hàng</h2>
  <form action="https://formsubmit.co/longpubg02ml1@gmail.com" method="POST">
    <!-- Hidden configs -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://longdz137.github.io/myvps/thanks.html">

    <label for="name">Họ và Tên</label>
    <input type="text" id="name" name="Họ và Tên" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Số điện thoại</label>
    <input type="tel" id="phone" name="SĐT" required>

    <label for="vps">Gói VPS</label>
    <select id="vps" name="Gói VPS" required>
      <option value="">-- Chọn gói --</option>
      <option value="Cơ Bản">Cơ Bản - 50.000đ</option>
      <option value="Phổ Thông">Phổ Thông - 90.000đ</option>
      <option value="Doanh Nghiệp">Doanh Nghiệp - 160.000đ</option>
    </select>

    <label for="payment">Hình thức thanh toán</label>
    <select id="payment" name="Thanh toán" onchange="toggleBankInfo()" required>
      <option value="">-- Chọn --</option>
      <option value="MOMO">Ví MOMO</option>
      <option value="Chuyển khoản">Chuyển khoản Ngân hàng</option>
    </select>

    <div class="bank-info" id="bank-info">
      <strong>Thông tin chuyển khoản:</strong><br />
      Ngân hàng: Vietcombank<br />
      Số TK: 0123456789<br />
      Chủ TK: NGUYEN VAN A<br />
      Nội dung: [Họ Tên] + Mua VPS
    </div>

    <button type="submit">🔐 Xác Nhận & Thanh Toán</button>
  </form>
</div>

<footer>
  © 2025 Công Ty ABC. All rights reserved.
</footer>

<script>
  function toggleBankInfo() {
    const method = document.getElementById('payment').value;
    document.getElementById('bank-info').style.display = method === "Chuyển khoản" ? "block" : "none";
  }
</script>

</body>
</html>
