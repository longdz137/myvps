<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh Toán VPS</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; padding: 2rem; }
    .form-container {
      max-width: 400px; background: white; padding: 2rem;
      margin: auto; border-radius: 8px; box-shadow: 0 0 10px #ccc;
    }
    h2 { text-align: center; margin-bottom: 1rem; }
    label { display: block; margin-top: 1rem; }
    input, select {
      width: 100%; padding: 0.5rem; margin-top: 0.3rem;
      border: 1px solid #ccc; border-radius: 5px;
    }
    button {
      margin-top: 1.5rem; width: 100%; padding: 0.6rem;
      background: #007bff; color: white; border: none; border-radius: 5px;
      font-weight: bold; cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>🧾 Thanh Toán VPS</h2>
    <form onsubmit="submitForm(event)">
      <label>Họ và tên</label>
      <input type="text" required>

      <label>Email</label>
      <input type="email" required>

      <label>Số điện thoại</label>
      <input type="tel" required>

      <label>Gói VPS</label>
      <select id="goi-vps" required>
        <option value="">-- Chọn gói --</option>
        <option>Gói Cơ Bản - 50.000đ</option>
        <option>Gói Phổ Biến - 90.000đ</option>
        <option>Gói Cao Cấp - 160.000đ</option>
      </select>

      <label>Hình thức thanh toán</label>
      <select required>
        <option value="">-- Chọn --</option>
        <option>MOMO</option>
        <option>Ngân hàng</option>
      </select>

      <button type="submit">Xác Nhận Thanh Toán</button>
    </form>
  </div>

  <script>
    // Lấy gói từ URL nếu có
    const urlParams = new URLSearchParams(window.location.search);
    const goi = urlParams.get('goi');
    if (goi) {
      const select = document.getElementById('goi-vps');
      for (let option of select.options) {
        if (option.text.includes(goi)) {
          option.selected = true;
          break;
        }
      }
    }

    function submitForm(e) {
      e.preventDefault();
      alert("✅ Đơn hàng đã được gửi. Chúng tôi sẽ liên hệ sớm!");
    }
  </script>

</body>
</html>
