<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đặt Mua VPS - Công Ty ABC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background-color: #f7f9fc;
      color: #333;
    }

    header {
      background-color: #0d6efd;
      color: #fff;
      padding: 20px 40px;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      color: #0d6efd;
    }

    label {
      display: block;
      margin-top: 20px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 14px;
      background-color: #198754;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #157347;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>ĐẶT MUA VPS - CÔNG TY ABC</h1>
</header>

<div class="container">
  <h2>Thông Tin Đơn Hàng</h2>
  <form action="payment.html" method="GET">
    <label for="name">Họ và Tên</label>
    <input type="text" id="name" name="Họ và Tên" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="Email" required>

    <label for="phone">Số điện thoại</label>
    <input type="tel" id="phone" name="SĐT" required>

    <label for="vps">Chọn Gói VPS</label>
    <select id="vps" name="Gói VPS" required>
      <option value="">-- Chọn gói --</option>
      <option value="Cơ Bản">Cơ Bản - 50.000đ</option>
      <option value="Phổ Thông">Phổ Thông - 90.000đ</option>
      <option value="Doanh Nghiệp">Doanh Nghiệp - 160.000đ</option>
    </select>

    <button type="submit">🔐 Đi đến trang thanh toán</button>
  </form>
</div>

<footer>
  © 2025 Công Ty ABC. All rights reserved.
</footer>

</body>
</html>
